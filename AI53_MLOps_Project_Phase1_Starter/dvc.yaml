stages:
  validate:
    cmd: uv run --locked python -m src.validate_data
    deps:
      - src/validate_data.py
      - data/raw
    outs:
      - reports/data_quality.json

  prepare:
    cmd: uv run --locked python -m src.prepare
    deps:
      - src/prepare.py
      - data/raw
      - reports/data_quality.json
    params:
      - data.image_size
    outs:
      - data/processed
      - reports/data_summary.json

  train:
    cmd: uv run --locked python -m src.train
    deps:
      - src/train.py
      - src/data.py
      - src/model.py
      - src/reproducibility.py
      - src/provenance.py
      - data/processed
    params:
      - data.image_size
      - train
      - augmentation
      - compute.device
      - tracking.uri
      - tracking.experiment
    outs:
      - models/model.pt
      - reports/run_manifest.json
      - reports/training_curves.png
    metrics:
      - reports/train_summary.json:
          cache: false

  evaluate:
    cmd: uv run --locked python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/data.py
      - src/provenance.py
      - data/processed
    params:
      - data.image_size
      - evaluation.batch_size
      - compute.device
      - tracking.uri
      - tracking.experiment
      - selection.run_id
    outs:
      - reports/test_confusion_matrix.png
    metrics:
      - reports/test_metrics.json:
          cache: false